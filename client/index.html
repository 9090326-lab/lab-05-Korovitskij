<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Lab 05: Multiplayer Simulation & Netgraph</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <!-- Панель Netgraph для лаби 5 -->
    <div id="netgraph" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #00ff00; padding: 10px; font-family: monospace; font-size: 12px; pointer-events: none; border: 1px solid #00ff00; border-radius: 4px; z-index: 1000;">
        <div>RTT: <span id="ng-rtt">0</span> ms</div>
        <div>Snapshot Age: <span id="ng-age">0</span> ms</div>
        <div>Traffic: <span id="ng-bytes">0</span> bytes/sec</div>
        <div>Input Queue: <span id="ng-queue">0</span></div>
        <div>Correction: <span id="ng-correction">0</span> px</div>
    </div>

    <div id="hud">Steps/s: 0 | FPS: 0 | Frame: 0ms</div>
    <canvas id="game"></canvas>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
